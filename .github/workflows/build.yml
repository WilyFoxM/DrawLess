name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Check formatting
        run: ./gradlew spotlessCheck
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run published unit tests
        run: |
          ./gradlew test
          compgen -G 'build/test-results/test/TEST-*.xml' > /dev/null
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-test-results
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build
      - name: Check diagnostics stay in the add-on
        run: |
          release=$(ls build/libs/drawless-*.jar | grep -v -e sources -e 'drawless-dev-')
          if unzip -l "$release" | grep -E 'ru/wilyfox/drawless/(diagnostics|dev)/'; then exit 1; fi
          unzip -l build/libs/drawless-dev-*.jar | grep -q 'ru/wilyfox/drawless/diagnostics/'
      - uses: actions/upload-artifact@v4
        with:
          name: DrawLess
          path: build/libs/*.jar
