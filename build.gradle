import net.fabricmc.loom.task.prod.ClientProductionRunTask

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'info.solidsoft.pitest' version '1.19.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "maven.modrinth:sodium:mc26.2-0.9.2-fabric"
    if (project.hasProperty("withSodium")) runtimeOnly "maven.modrinth:sodium:mc26.2-0.9.2-fabric"
    if (project.hasProperty("withImmediatelyFast")) runtimeOnly "maven.modrinth:immediatelyfast:1.16.5+26.2-fabric"
    if (project.hasProperty("withIris")) runtimeOnly "maven.modrinth:iris:1.11.4+26.2-fabric"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// Diagnostics live in a separate add-on mod, outside the release jar.
sourceSets {
    dev {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

processDevResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.register('devJar', Jar) {
    archiveBaseName = "${project.archives_base_name}-dev"
    from sourceSets.dev.output
    from("LICENSE") {
        rename { "${it}_${archiveBaseName.get()}" }
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('devJar')
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    // Minecraft 26.2 uses official names; the normal jar is the distributable artifact.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
    includeEmptyDirs = false
    from("LICENSE")
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

// Keep native client tests in a separate mod, outside the release jar.
fabricApi.configureTests {
    createSourceSet = true
    modId = "drawless-test"
    enableGameTests = false
    enableClientGameTests = true
    eula = true
}

sourceSets {
    gametest {
        compileClasspath += dev.output
        runtimeClasspath += dev.output
    }
    test {
        compileClasspath += dev.output
        runtimeClasspath += dev.output
    }
}

loom {
    mods {
        drawless {
            sourceSet sourceSets.main
        }
        "drawless-dev" {
            sourceSet sourceSets.dev
        }
    }
}

// Starts the release JAR alone from a real mods folder; requires local fixtures.
sourceSets {
    releaseSmoke {
        compileClasspath += main.output + main.compileClasspath
    }
}

configurations {
    releaseSmokeMods {
        transitive = false
    }
}

dependencies {
    releaseSmokeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    releaseSmokeMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
    if (project.hasProperty("withSodium")) releaseSmokeMods "maven.modrinth:sodium:mc26.2-0.9.2-fabric"
    if (project.hasProperty("withImmediatelyFast")) releaseSmokeMods "maven.modrinth:immediatelyfast:1.16.5+26.2-fabric"
}

def releaseSmokeJar = tasks.register('releaseSmokeJar', Jar) {
    archiveBaseName = 'drawless-release-smoke'
    destinationDirectory = layout.buildDirectory.dir('release-smoke')
    from sourceSets.releaseSmoke.output
}

tasks.register('runReleaseSmoke', ClientProductionRunTask) {
    group = 'verification'
    onlyIf('local fixtures are available') { !sourceSets.releaseSmoke.allJava.empty }
    mods.from(tasks.named('jar'), releaseSmokeJar, configurations.releaseSmokeMods)
    jvmArgs.add('-Dfabric.client.gametest')
    runDir = layout.buildDirectory.dir('run/releaseSmoke')
}

apply from: 'gradle/quality.gradle'
apply from: 'gradle/mutation.gradle'
